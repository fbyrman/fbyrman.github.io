<section class="tex-section" id="sec-conclusion">
  <h2 class="sec-title"><span class="num">6</span> Conclusion</h2>

  <p>
    DN-CBMs name their neurons after training, and nothing in training ties a
    neuron to its name. Many names do not fit, so the explanations built on them are not
    faithful. A short fine-tune that rewards alignment makes the names fit, at a small
    cost in accuracy.
  </p>
</section>
