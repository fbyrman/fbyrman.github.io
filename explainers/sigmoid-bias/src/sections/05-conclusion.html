<section class="tex-section" id="sec-conclusion">
  <h2 class="sec-title"><span class="num">5</span> Conclusion</h2>

  <p>
  <p>
    The bias decides where sigmoid-loss training starts. SigLIP's $b = -10$ assumes a
    fixed batch size and a similarity centred at zero; prior matching drops both
    assumptions at the cost of estimating one number. That was enough to train with the
    sigmoid loss in hyperbolic space.
  </p>
